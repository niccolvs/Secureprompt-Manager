<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - SPM</title>
    <link rel="stylesheet" href="register.css" />
</head>

<body>

    <!-- Panel Izquierdo (Imagen y Logo) -->
    <div class="left-panel">
        <div class="logo-container" style="display: flex; align-items: center; gap: 180px;">
            <a href="home.html">
                <img src="../assets/logo/SPM_logo_claro.png" alt="SecurePrompt Manager"
                    style="max-width:160px;height:auto;display:block" />
            </a>
            <a href="home.html"
                style="background-color: rgba(255, 255, 255, 0.5); padding: 8px 20px; border-radius: 30px; color: #ffffff; text-decoration: none; font-size: 14px; font-weight: 500; backdrop-filter: blur(8px); transition: background-color 0.2s ease;"
                onmouseover="this.style.backgroundColor='rgba(255, 255, 255, 0.5)'"
                onmouseout="this.style.backgroundColor='rgba(255, 255, 255, 0.3)'">
                Volver al sitio
            </a>
        </div>
    </div>

    <!-- Panel Derecho (Formulario de Registro) -->
    <div class="right-panel">
        <div class="form-wrapper">
            <h2 class="register-title">Crea una cuenta</h2>

            <form action="#" method="POST">
                <!-- Fila de Nombre y Apellido -->
                <div class="input-row">
                    <input type="text" class="form-input" placeholder="Nombre" required>
                    <input type="text" class="form-input" placeholder="Apellido" required>
                </div>

                <!-- Email -->
                <div class="input-group">
                    <input type="email" class="form-input" placeholder="Email" required>
                </div>

                <!-- Contraseña -->
                <div class="input-group">
                    <input type="password" class="form-input" placeholder="Contraseña" required>
                </div>

                <button type="submit" class="btn-primary">Crear cuenta</button>
            </form>

            <div class="divider">
                <span>o</span>
            </div>

            <button class="btn-google">
                <!-- SVG del Logo de Google -->
                <svg viewBox="0 0 24 24">
                    <path
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        fill="#4285F4" />
                    <path
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853" />
                    <path
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                        fill="#FBBC05" />
                    <path
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        fill="#EA4335" />
                </svg>
                Regístrate con Google
            </button>

            <p class="login-text">
                ¿Ya tienes cuenta? <a href="login.html" class="login-link">Inicia sesión</a>
            </p>
        </div>
    </div>

</body>

</html>
