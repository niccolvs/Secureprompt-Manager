<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="logo-area">
        <div class="logo-icon">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
            <path d="M4 8L7 11L12 5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="logo-text">SecurePrompt</span>
      </div>
    </header>

    <main class="popup-main">
      <div class="section-title">Mis Prompts Favoritos</div>
      <div id="prompts-lista" class="prompts-lista">
        <div class="loading">Cargando tus prompts...</div>
      </div>
    </main>

    <footer class="popup-footer">
      <button id="btn-abrir-dashboard" class="btn-dashboard">
        Ir al Panel de Control ↗
      </button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
